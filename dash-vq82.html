<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>유플리 · 운영 대시보드</title>
<style>
  .viz-root {
    color-scheme: light;
    --surface-1:#fcfcfb; --page:#f9f9f7;
    --ink-1:#0b0b0b; --ink-2:#52514e; --ink-3:#898781;
    --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,0.10);
    --series-1:#2a78d6;
    --st-good:#0ca30c; --st-warn:#fab219; --st-serious:#ec835a; --st-crit:#d03b3b;
    --delta-good:#006300;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) .viz-root {
      color-scheme: dark;
      --surface-1:#1a1a19; --page:#0d0d0d;
      --ink-1:#ffffff; --ink-2:#c3c2b7; --ink-3:#898781;
      --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,0.10);
      --series-1:#3987e5; --delta-good:#0ca30c;
    }
  }
  * { box-sizing:border-box; margin:0; }
  body.viz-root { background:var(--page); color:var(--ink-1);
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif; padding:20px; }
  .wrap { max-width:880px; margin:0 auto; display:grid; gap:14px; }
  header { display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; gap:8px; }
  h1 { font-size:18px; font-weight:700; }
  .sub { font-size:12px; color:var(--ink-3); }
  .card { background:var(--surface-1); border:1px solid var(--border); border-radius:10px; padding:16px; }
  .tiles { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; }
  .tile .k { font-size:12px; color:var(--ink-2); margin-bottom:6px; }
  .tile .v { font-size:26px; font-weight:700; line-height:1.1; }
  .tile .d { font-size:12px; color:var(--ink-3); margin-top:4px; }
  .d .up { color:var(--delta-good); font-weight:600; }
  h2 { font-size:13px; font-weight:700; color:var(--ink-2); margin-bottom:10px; }
  .status { display:inline-flex; align-items:center; gap:6px; font-weight:700; font-size:15px; }
  .dot { width:10px; height:10px; border-radius:50%; display:inline-block; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th { text-align:left; color:var(--ink-3); font-weight:600; font-size:11px; padding:6px 8px; border-bottom:1px solid var(--grid); }
  td { padding:7px 8px; border-bottom:1px solid var(--grid); font-variant-numeric:tabular-nums; }
  td a { color:var(--series-1); text-decoration:none; }
  .num { text-align:right; }
  .btnrow { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
  .btn { display:inline-block; padding:8px 14px; border-radius:8px; font-size:13px; font-weight:600;
    text-decoration:none; border:1px solid var(--border); color:var(--ink-1); background:transparent; }
  .btn.primary { background:var(--series-1); color:#fff; border-color:transparent; }
  .btn.danger { color:var(--st-crit); border-color:var(--st-crit); }
  .chartbox { position:relative; }
  #tip { position:absolute; pointer-events:none; background:var(--surface-1); border:1px solid var(--border);
    border-radius:6px; padding:6px 9px; font-size:12px; display:none; box-shadow:0 2px 8px rgba(0,0,0,.12); white-space:nowrap; }
  #tip b { font-variant-numeric:tabular-nums; }
  .topic { display:flex; gap:8px; padding:7px 0; border-bottom:1px solid var(--grid); font-size:13px; align-items:baseline; }
  .topic .s { color:var(--ink-3); font-size:11px; min-width:110px; }
  .foot { font-size:12px; color:var(--ink-3); display:flex; gap:14px; flex-wrap:wrap; }
  .foot a { color:var(--ink-2); }
  .tgl { font-size:12px; color:var(--ink-3); background:none; border:none; cursor:pointer; text-decoration:underline; padding:0; }
  .hidden { display:none; }
</style>
</head>
<body class="viz-root">
<div class="wrap">
  <header>
    <h1>유플리 · 운영 대시보드</h1>
    <span class="sub" id="asof">불러오는 중…</span>
  </header>

  <div class="tiles">
    <div class="card tile"><div class="k">팔로워</div><div class="v" id="t-fol">–</div><div class="d" id="t-fol-d"></div></div>
    <div class="card tile"><div class="k">오늘 발행</div><div class="v" style="font-size:15px;margin-top:5px"><span class="status" id="t-pub"><span class="dot" style="background:var(--ink-3)"></span>확인 중</span></div><div class="d" id="t-pub-d"></div></div>
    <div class="card tile"><div class="k">누적 게시물</div><div class="v" id="t-media">–</div><div class="d">카드+릴스</div></div>
    <div class="card tile"><div class="k">대기 주제</div><div class="v" id="t-topics">–</div><div class="d" id="t-topics-d"></div></div>
  </div>

  <div class="card">
    <h2>팔로워 추이 <button class="tgl" id="tgl-tbl">표로 보기</button></h2>
    <div class="chartbox"><svg id="chart" width="100%" height="180" role="img" aria-label="팔로워 추이 선 차트"></svg><div id="tip"></div></div>
    <table id="fol-table" class="hidden"><thead><tr><th>날짜</th><th class="num">팔로워</th></tr></thead><tbody></tbody></table>
  </div>

  <div class="card">
    <h2>오늘 콘텐츠</h2>
    <div id="today-links" style="font-size:13px; color:var(--ink-2)">확인 중…</div>
    <div class="btnrow">
      <a class="btn danger" id="btn-stop" target="_blank" rel="noopener">⛔ 오늘 발행 중지 (이슈에 stop 댓글)</a>
      <a class="btn" href="https://github.com/phone-mollae/phone-mollae.github.io/actions" target="_blank" rel="noopener">실행 로그</a>
    </div>
  </div>

  <div class="card">
    <h2>최근 게시물 반응</h2>
    <table id="media-table"><thead><tr><th>게시일</th><th>형식</th><th class="num">좋아요</th><th class="num">댓글</th><th>링크</th></tr></thead><tbody></tbody></table>
  </div>

  <div class="card">
    <h2>주제 큐</h2>
    <div id="topics"></div>
    <div class="btnrow">
      <a class="btn primary" id="btn-add" target="_blank" rel="noopener">＋ 주제 추가</a>
      <a class="btn" id="btn-design" target="_blank" rel="noopener">🎨 디자인 설정</a>
      <a class="btn" href="https://github.com/phone-mollae/phone-mollae.github.io/edit/main/topics.json" target="_blank" rel="noopener">직접 편집 (고급)</a>
    </div>
    <div class="sub" style="margin-top:8px">주제 추가 버튼 → 양식이 채워진 이슈가 열립니다. 그대로 등록하면 자동으로 큐에 반영됩니다.</div>
  </div>

  <div class="card foot">
    <a href="https://www.instagram.com/uplus_uply/" target="_blank" rel="noopener">@uplus_uply</a>
    <a href="https://github.com/phone-mollae/phone-mollae.github.io" target="_blank" rel="noopener">저장소</a>
    <span id="runinfo"></span>
  </div>
</div>

<script>
const REPO = 'phone-mollae/phone-mollae.github.io';
const kstDate = () => new Date(Date.now() + 9*3600*1000).toISOString().slice(0,10);
const fmt = n => n==null ? '–' : n.toLocaleString('ko-KR');
const $ = id => document.getElementById(id);

// ── 주제 추가 이슈 프리필
{
  const body = encodeURIComponent(
`아래 형식을 채워 그대로 등록하세요. 등록하면 자동으로 주제 큐(topics.json)에 추가됩니다.

시리즈: 신모델   (신모델 / 혜택 / 꿀팁 중 하나)
주제: 여기에 주제 한 줄
메모: (선택) 참고 링크나 방향`);
  $('btn-add').href = `https://github.com/${REPO}/issues/new?labels=topic-request&title=${encodeURIComponent('[주제추가] ')}&body=${body}`;
}

// ── 디자인 설정 이슈 프리필
{
  const dbody = encodeURIComponent(
`바꾸고 싶은 항목만 남기고 나머지 줄은 지워도 됩니다. 등록하면 자동으로 design.json에 반영되고 다음 발행부터 적용됩니다.

채널이름: 유플리
핸들: @uplus_uply
메인컬러: #E6007E
보조컬러: #7B2BD9
시리즈: 신모델=#E6007E, 혜택=#7B2BD9, 꿀팁=#0BA394`);
  $('btn-design').href = `https://github.com/${REPO}/issues/new?labels=design-request&title=${encodeURIComponent('[디자인설정] ')}&body=${dbody}`;
}

// ── 데이터 로드
async function j(url){ const r = await fetch(url + (url.includes('?')?'&':'?') + 'v=' + Date.now()); if(!r.ok) throw r.status; return r.json(); }

(async () => {
  try {
    const s = await j('stats.json');
    const snaps = Array.isArray(s) ? s : (s.snapshots||[]);
    const byDay = {};
    snaps.forEach(x => byDay[x.at.slice(0,10)] = x);
    const days = Object.keys(byDay).sort();
    const pts = days.map(d => ({ d, f: byDay[d].followers }));
    const last = byDay[days[days.length-1]];
    $('t-fol').textContent = fmt(last.followers);
    if (pts.length >= 2) {
      const diff = last.followers - pts[pts.length-2].f;
      $('t-fol-d').innerHTML = diff >= 0 ? `전일 대비 <span class="up">＋${diff}</span>` : `전일 대비 ${diff}`;
    }
    $('t-media').textContent = fmt(last.media_count);
    $('asof').textContent = '데이터 기준: ' + last.at.replace('T',' ').slice(0,16) + ' UTC';
    drawChart(pts);
    const tb = $('fol-table').querySelector('tbody');
    tb.innerHTML = pts.map(p=>`<tr><td>${p.d}</td><td class="num">${fmt(p.f)}</td></tr>`).join('');
    const mb = $('media-table').querySelector('tbody');
    mb.innerHTML = (last.media||[]).map(m=>{
      const t = m.type==='VIDEO' ? '릴스' : '카드';
      return `<tr><td>${m.ts.slice(0,10)}</td><td>${t}</td><td class="num">${fmt(m.likes)}</td><td class="num">${fmt(m.comments)}</td><td><a href="${m.permalink}" target="_blank" rel="noopener">보기 ↗</a></td></tr>`;
    }).join('');
  } catch(e) { $('asof').textContent = 'stats.json 로드 실패'; }

  try {
    const t = await j('topics.json');
    const items = Array.isArray(t) ? t : (t.topics||[]);
    const wait = items.filter(x => x.status==='대기');
    $('t-topics').textContent = wait.length;
    $('t-topics-d').textContent = '주 3회 기준 약 ' + (wait.length/3).toFixed(1) + '주분';
    $('topics').innerHTML = wait.map(x =>
      `<div class="topic"><span class="s">${x.series||''} ${x.issueNo||''}</span><span>${x.topic||''}</span></div>`
    ).join('') || '<div class="sub">대기 주제가 없습니다 — 일요일 밤 자동 보충 예정</div>';
  } catch(e) {}

  const today = kstDate();
  try {
    const p = await j(`posts/${today}/published.json`);
    setPub('good', '발행 완료', (p.carousel?.at||'').replace('T',' ').slice(11,16) + ' UTC');
    const links = [];
    if (p.carousel?.permalink) links.push(`<a href="${p.carousel.permalink}" target="_blank" rel="noopener">오늘 카드 ↗</a>`);
    if (p.reel?.permalink) links.push(`<a href="${p.reel.permalink}" target="_blank" rel="noopener">오늘 릴스 ↗</a>`);
    $('today-links').innerHTML = links.join(' · ') || '기록 없음';
  } catch(e) {
    const h = new Date(Date.now()+9*3600*1000).getUTCHours();
    if (h < 10) setPub('warn', '발행 전', '10:07 예정');
    else if (h < 13) setPub('warn', '진행 중/대기', '10:07~12:43 슬롯');
    else setPub('crit', '미발행', '점검 필요');
    $('today-links').textContent = '오늘자 발행 기록이 아직 없습니다.';
  }
  function setPub(kind, label, sub){
    const c = kind==='good' ? 'var(--st-good)' : kind==='warn' ? 'var(--st-warn)' : 'var(--st-crit)';
    const i = kind==='good' ? '✅' : kind==='warn' ? '⏳' : '❌';
    $('t-pub').innerHTML = `<span class="dot" style="background:${c}"></span>${i} ${label}`;
    $('t-pub-d').textContent = sub;
  }

  try {
    const iss = await j(`https://api.github.com/repos/${REPO}/issues?state=open&labels=publish-queue`);
    $('btn-stop').href = iss.length ? iss[0].html_url : `https://github.com/${REPO}/issues?q=label%3Apublish-queue`;
    if (!iss.length) { $('btn-stop').textContent = '발행 대기 이슈 없음 (이미 처리됨)'; }
  } catch(e) { $('btn-stop').href = `https://github.com/${REPO}/issues`; }
  try {
    const r = await j(`https://api.github.com/repos/${REPO}/actions/workflows/publish.yml/runs?per_page=1`);
    const run = r.workflow_runs?.[0];
    if (run) $('runinfo').textContent = `최근 게시 실행: ${run.conclusion||run.status} (${run.created_at.replace('T',' ').slice(0,16)} UTC)`;
  } catch(e) {}
})();

function drawChart(pts){
  const svg = $('chart'), tip = $('tip');
  const W = svg.clientWidth || 820, H = 180, m = {t:12, r:12, b:22, l:40};
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  const xs = i => m.l + (W-m.l-m.r) * (pts.length===1 ? .5 : i/(pts.length-1));
  const fmin = Math.min(...pts.map(p=>p.f)), fmax = Math.max(...pts.map(p=>p.f));
  const lo = Math.max(0, Math.floor((fmin-5)/10)*10), hi = Math.ceil((fmax+5)/10)*10;
  const ys = v => m.t + (H-m.t-m.b) * (1 - (v-lo)/(hi-lo||1));
  const css = v => getComputedStyle(document.body).getPropertyValue(v).trim();
  let g = '';
  for (let k=0;k<=2;k++){ const v = lo + (hi-lo)*k/2, y = ys(v);
    g += `<line x1="${m.l}" y1="${y}" x2="${W-m.r}" y2="${y}" stroke="${css('--grid')}" stroke-width="1"/>`;
    g += `<text x="${m.l-6}" y="${y+4}" text-anchor="end" font-size="10" fill="${css('--ink-3')}" font-variant-numeric="tabular-nums">${v}</text>`; }
  const step = Math.max(1, Math.ceil(pts.length/6));
  pts.forEach((p,i)=>{ if(i%step===0 || i===pts.length-1)
    g += `<text x="${xs(i)}" y="${H-6}" text-anchor="middle" font-size="10" fill="${css('--ink-3')}">${p.d.slice(5)}</text>`; });
  const path = pts.map((p,i)=>`${i?'L':'M'}${xs(i)},${ys(p.f)}`).join('');
  g += `<path d="${path}" fill="none" stroke="${css('--series-1')}" stroke-width="2" stroke-linejoin="round"/>`;
  const li = pts.length-1;
  g += `<circle cx="${xs(li)}" cy="${ys(pts[li].f)}" r="4" fill="${css('--series-1')}" stroke="${css('--surface-1')}" stroke-width="2"/>`;
  g += `<text x="${Math.min(xs(li), W-m.r-8)}" y="${ys(pts[li].f)-9}" text-anchor="end" font-size="11" font-weight="600" fill="${css('--ink-1')}">${pts[li].f}</text>`;
  g += `<line id="xh" x1="0" y1="${m.t}" x2="0" y2="${H-m.b}" stroke="${css('--axis')}" stroke-width="1" visibility="hidden"/>`;
  svg.innerHTML = g;
  const xh = svg.querySelector('#xh');
  svg.addEventListener('mousemove', ev => {
    const r = svg.getBoundingClientRect(), x = (ev.clientX-r.left) * (W/r.width);
    let bi = 0, bd = 1e9;
    pts.forEach((p,i)=>{ const d = Math.abs(xs(i)-x); if(d<bd){bd=d;bi=i;} });
    xh.setAttribute('x1', xs(bi)); xh.setAttribute('x2', xs(bi)); xh.setAttribute('visibility','visible');
    tip.style.display='block';
    tip.innerHTML = `${pts[bi].d} · 팔로워 <b>${pts[bi].f}</b>`;
    const bx = svg.parentElement.getBoundingClientRect();
    tip.style.left = Math.min(ev.clientX-bx.left+12, bx.width-140)+'px';
    tip.style.top  = (ev.clientY-bx.top-34)+'px';
  });
  svg.addEventListener('mouseleave', ()=>{ xh.setAttribute('visibility','hidden'); tip.style.display='none'; });
}
$('tgl-tbl').addEventListener('click', ()=>{
  const t = $('fol-table'), on = t.classList.toggle('hidden');
  $('tgl-tbl').textContent = on ? '표로 보기' : '차트만 보기';
});
</script>
</body>
</html>
